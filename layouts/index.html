{{ define "main" }}

<section class="main-top-row-content">
  <div class="main-top-row row content">
    {{ partial "now-on-air.html" . }}

    <div id="chat">
      <iframe
        id="tlkio-chat"
        src="https://tlk.io/rebootchat?theme=theme--minimal"
        frameborder="0"
        allowfullscreen>
      </iframe>
      <div class="chat-fallback">
        <a href="https://tlk.io/rebootchat" target="_blank" rel="noopener noreferrer" class="day-button">
          Δε δουλεύει το chat; Πάτα εδώ!
        </a>
      </div>
    </div>
  </div>
</section>

<script>
  (function () {
    var chat = document.getElementById("chat");
    var iframe = document.getElementById("tlkio-chat");

    function markFailed() {
      chat.classList.add("chat-failed");
    }

    // A cross-origin iframe fires "load" even when the navigation itself
    // failed (DNS error, offline, connection refused) - the browser just
    // loads its own error page inside the frame and calls that a successful
    // load. That makes "load" useless as a success signal here, so instead
    // we independently probe reachability of the same URL with fetch, which
    // does reject on those network-level failures. "error" is kept as a
    // bonus signal for the cases (e.g. some ad blockers) where the browser
    // does report the frame itself as blocked.
    iframe.addEventListener("error", markFailed);

    fetch(iframe.src, {
      mode: "no-cors",
      cache: "no-store",
      signal: AbortSignal.timeout(6000),
    }).catch(markFailed);
  })();
</script>

<section class="main-mid-bot-row-content">
  <div class="main-mid-bot-row row content">
    {{ partial "mixcloud.html" . }}
  </div>
</section>

<section class="main-last-row-content">
  <div class="main-last-row row content">
    {{ partial "carousel.html" . }}
  </div>
</section>
{{ end }}
