<div class="header-player">
    <div class="player-content">
      <div class="header-left">
        <span class="listen-live-label">Listen Live</span>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openplayerjs/2.14.10/openplayer.min.css">
        <div class="audio__container" style="width: 170px;">
          <audio class="op-player__media" controls preload="none" id="audio">
            <source src="https://radioreb.radioca.st/stream" type="audio/mp3">
          </audio>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/openplayerjs/2.14.10/openplayer.min.js"></script>
        <script>
          window.addEventListener('DOMContentLoaded', function() {
            const player = new OpenPlayerJS('audio', {
              controls: {
                layers: {
                  left: ['play', 'volume'],
                  middle: [],
                  right: [],
                },
              },
              // OpenPlayerJS hides its volume slider on Android/iOS by
              // default (useDeviceVolume: true) on the assumption that
              // listeners will use their hardware buttons instead. This is a
              // shared radio stream people often listen to with the phone's
              // ringer/media volume already turned down for other apps, so
              // keep the on-screen slider everywhere instead of only on
              // desktop.
              useDeviceVolume: false,
            });
            player.init();

            // The live stream occasionally drops mid-playback (proxy/network
            // hiccups on the hosting side) and nothing here was ever
            // listening for that, so the player just went silent until the
            // listener manually refreshed the page. This keeps it alive by
            // reloading the source and resuming whenever that happens.
            //
            // OpenPlayerJS moves the "audio" id onto its own wrapper <div>
            // and strips it from the real <audio> element, but not
            // synchronously within init() - so the real element (the one
            // that actually fires media events) has to be polled for
            // instead of grabbed immediately.
            function findAudioEl() {
              const el = document.getElementById('audio');
              if (!el) return null;
              return el.tagName === 'AUDIO' ? el : el.querySelector('audio');
            }

            (function waitForAudioEl(attempts) {
              const audio = findAudioEl();
              if (!audio) {
                if (attempts > 20) return; // gave it 2s, OpenPlayerJS never finished setting up
                setTimeout(function () { waitForAudioEl(attempts + 1); }, 100);
                return;
              }

              const streamUrl = 'https://radioreb.radioca.st/stream';
              let reconnecting = false;
              let lastTime = -1;
              let stalledChecks = 0;

              function reconnectStream(reason) {
                if (reconnecting) return;
                reconnecting = true;
                console.info('[stream] reconnecting after ' + reason);
                audio.src = streamUrl + '?_=' + Date.now();
                audio.load();
                audio.play().catch(function () {
                  // Still down - the watchdog below keeps retrying.
                });
                stalledChecks = 0;
                setTimeout(function () { reconnecting = false; }, 5000);
              }

              audio.addEventListener('error', function () { reconnectStream('error event'); });
              audio.addEventListener('ended', function () { reconnectStream('ended event'); });

              // A live stream's currentTime should climb continuously while
              // playing. Some connection failures leave the element
              // "waiting" without ever firing "error" or "stalled", so this
              // watchdog is the only reliable way to catch those: no
              // progress across two checks (~20s) while supposedly playing
              // means it's stuck.
              setInterval(function () {
                if (audio.paused || reconnecting) {
                  lastTime = audio.currentTime;
                  stalledChecks = 0;
                  return;
                }
                if (audio.currentTime === lastTime) {
                  stalledChecks++;
                  if (stalledChecks >= 2) {
                    reconnectStream('stalled currentTime');
                  }
                } else {
                  stalledChecks = 0;
                }
                lastTime = audio.currentTime;
              }, 10000);
            })(0);
          });
        </script>
      </div>
      <div class="header-center">

                  poll_frequency: 5000
              };})();
            </script>

            <marquee behavior="scroll" direction="right" scrollamount="4" style="color: #fff;">

            </marquee>
          </div>
        </div>
