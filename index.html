ιβάλλον σου. Αυτό που σου επιτρέπει να ακούς την ίδια την πόλη, να ανήκεις πραγματικά στους δρόμους της. Αλλά ποιος, ή τι, σου μιλάει;\\n\\nΓια μία ώρα, στον ραδιοφωνικό αέρα του Radio Reboot, συντονιζόμαστε στην πόλη και ακούμε τις μουσικές της. Post-punk και shoegaze από τα κρυφά μπαράκια, hip hop από τα στενά της, post-rock από τους λόφους και τα πάρκα, και ο,τι άλλο προκύψει, από τα μπαλκόνια, μέχρι τα υπόγεια και τις πλατείες.\\n\\n*Ο τίτλος και το πρώτο μέρος του κειμένου, εμπνευσμένα και παρμένα από το αγαπημένο Disco Elysium.","id":"shivers","image":"images/radio-shows/shivers.jpg","schedule":{"Tuesday":"19:30 - 21:00"},"title":"Shivers"},{"description":"Ο νεοκυματισμός, λένε, μπαίνει από τ’ αυτιά.","id":"newwavegirl","image":"images/radio-shows/newwavegirlph.jpg","schedule":{"Tuesday":"21:00 - 23:00"},"title":"New Wave Girl"},{"description":"Αισθάνεται μεγαλύτερη άνεση στις παρυφές, παρά στο κέντρο… Εγγενώς αμφίσημη και πολύμορφη, διαπερνά τα συμβατικά όρια και διαφεύγει τον ορισμό…","id":"letmeride","image":"images/radio-shows/letmeridenewlogo.png","schedule":{"Wednesday":"21:30 - 22:30"},"title":"Let Me ride"},{"description":"","id":"metaheriastistsepes","image":"images/radio-shows/tsepesupd.jpg","schedule":{"Wednesday":"19:00 - 20:00"},"title":"Με τα χέρια στις τσέπες"},{"description":"Μια περιπλάνηση σε όλο το φάσμα του rock n’ roll {garage, (post) punk, grunge, indie/alternative κ.ά.}, με απαραίτητη προϋπόθεση απ’τα κομμάτια να ξεπηδάνε φλόγα, πάθος, ψυχή και τσαγανό. Κομμάτια που μαζί τους μεγαλώσαμε, ερωτευτήκαμε, πολιτικοποιηθήκαμε, ξενυχτήσαμε, χορέψαμε, κλάψαμε.\\nΓιατί τα εφηβικά μας σκιρτήματα και όνειρα δεν ξεπερνιούνται εύκολα.\\nΓιατί όλα αυτά μας κάνανε αυτό που είμαστε τώρα.\\nΓιατί πατρίδα μας είναι τα παιδικά μας χρόνια.","id":"teenagekicks","image":"images/radio-shows/teenagekicks.jpg","schedule":{"Wednesday":"20:00 - 21:30"},"title":"Teenage Kicks"},{"description":"Οι Dudes δεν πίνουν White Russian, δεν παίζουν μπόουλινγκ, ούτε κυκλοφορούν με μπουρνούζι. Αλλά τους αρέσει το σινεμά. Κι αφού έχουν διαφωνήσει μεταξύ τους αμέτρητες φορές, σας καλούν αγωνιωδώς να βοηθήσετε να διατηρηθεί η φιλία τους, συμμετέχοντας στις κινηματογραφικές (και όχι μόνο) αναζητήσεις τους.","id":"thedudes","image":"images/radio-shows/thedudes.jpg","schedule":{"Thursday":"22:00 - 00:00"},"title":"The Dudes"},{"description":"Μουσικές για ταινίες και ταινίες για συναισθήματα","id":"electricfrequencies","image":"images/radio-shows/electricfrequencies.png","schedule":{"Thursday":"19:00 - 21:00"},"title":"Electric Frequencies"},{"description":"Εκπομπή που δίνει κομμάτια που δεν έχει, σε ακροατές που δεν τα θέλουν. Εβδομαδιαία ανασκόπηση νέων και παλιών μουσικών εμμονών χωρίς δέσμευση στο είδος, αλλά με εμφανή αδυναμία στην post-punk σκηνή και με ξεκάθαρη εξάρτηση από την εκάστοτε διάθεση.","id":"redflag","image":"images/radio-shows/redflag.jpg","schedule":{"Thursday":"21:00 - 22:00"},"title":"Red Flag"},{"description":"Ο Παρίας καταπιάνεται με θεματικές εκπομπές για κοινωνικοπολιτικά ζητήματα, μουσικά αφιερώματα, συνεντεύξεις /κουβέντες με πολλούς καλεσμένους και γενικότερα ό,τι άλλο του αρέσει και τον απασχολεί. Τις ηχογραφημένες εκπομπές του τις βρίσκετε στο Mixcloud του Radio Reboot!x","id":"parias","image":"images/radio-shows/parias.jpg","schedule":{"Friday":"20:00 - 22:00"},"title":"Παρίας"},{"description":"Mια εκπομπή ηλεκτρονικής μουσικής ψυχεδέλειας, με dark, forest, full on αλλά και progressive ακούσματα. Κάθε Παρασκευή 22:00 - 00:00, ψυχεδελικά και πολεμικά.","id":"psyvibes","image":"images/radio-shows/psyvibes.jpg","schedule":{"Friday":"22:00 - 00:00"},"title":"Psy Vibes"},{"description":"Στα μουσικά απολεσθέντα βρίσκεις ό,τι ψάχνεις και ό,τι δεν ξέρεις πως σου λείπει.","id":"lostandfound","image":"images/radio-shows/lostandfound.jpg","schedule":{"Monday":"20:00 - 22:00"},"title":"Lost \\u0026 Found"},{"description":"Canis Lupus, η αλλιώς η στιγμή που ο Fantastic Mr. Fox κάνει τη συνειδητοποίηση οτι το δίπολο άγριου ή πολιτισμένου ζώου είναι πλασματικό. Υπάρχουμε ως πολύπλευρες οντότητες άλλωστε, και ως τέτοιες αντανακλούμε τη λάμψη και το φως μας.\\n\\nΥπαρξιακά ερωτήματα, συζητήσεις για ταινίες (κουλτουρέ και μη) και μουσική βαϊμπαριστή από όλες τις χώρες και τα πιθανά είδη (ε, σχεδόν).\\n\\nΊσως και κάνα κουλ αφισάκι για να αλλάζουμε παραστάσεις.\\n\\nΓια κοπιάστε.","id":"canislupus","image":"images/radio-shows/canislupus.jpg","schedule":{"Saturday":"18:00 - 20:00"},"title":"Canis Lupus"},{"description":"Sundazed and confused τις Παρασκευές γίνεται;!","id":"sundazed","image":"images/radio-shows/sundazed.jpg","schedule":{"Friday":"18:30 - 20:00"},"title":"Sundazed"},{"description":"​Ένα πειρατικό καράβι, ονόματι Ναρόντναγια. Κουμανταδόρος, ένας απρόβλεπτος καπετάνιος από τις δυτικές συνοικίες της νύμφης του Θερμαϊκού, κραδαίνει τιμόνι και φωτοβολίδα έτοιμος για νέες περιπέτειες σε ανεξερεύνητες… μουσικές επιλογές, προερχόμενες από πολύ σουρεαλιστικές εποχές.\\n\\nΈκπτωτοι, Μαύρα Πρόβατα, Φρικιά, Κάγκουρες, Μεταλλάδες, Πόντιοι, Τζιβάτοι, Χούλιγκανς, Ντίσκο Γκέρλς, Περμανάντες, Θρασάδες, Πασιφιστές, Ποινικοί, Χίππιδες, Γκοθούδες, Κιουράδες, Σαϊκεντελάδες, ενώνουν τις φωνές τους, με το Α κεφαλαίο και κυκλωμένο και ανοίγουν την πόρτα της Περσεφόνης. Στον κόσμο αυτόν μπορούν να συνυπάρξουν τα πάντα, φτάνει η σύγκρουση να είναι από τα κάτω προς τα πάνω.","id":"blackmagic","image":"images/radio-shows/blackmagic.jpg","schedule":{"Tuesday":"23:00 - 01:00"},"title":"Black Magic"},{"description":"“I think it should be evident by now, but I'm as lost as anyone.”\\n\\nΜια αργή πορεία γεμάτη ροκ εν ρολ σε όλο του το φάσμα, με τις αναπόφευκτες ενδιάμεσες στάσεις: ιστορίες, παραληρήματα, ρητορικά ερωτήματα και hot takes. Λίγο πριν χαθείς στην καρδιά του Σαββατόβραδου, ποιος να σου πει και τι;","id":"idlemarch","image":"images/radio-shows/idlemarch.jpg","schedule":{"Saturday":"20:00 - 21:30"},"title":"Idle March"},{"description":"Τσουνάμι στα ραδιοκύματα!! Μην τυχόν! Μια εκπομπή σταθμός στο ελληνικό ραδιόφωνο: επικαιρότητα και παράδοση, χεμ σαμπού χεμ κοντίσιονερ!! Σκληρές αλήθειες και συνταγές μαγειρικής, αποκαλύψεις και συμβουλές για το σπίτι. Πολιτική και αισθησιασμός. Κάθε Τετάρτη, 13:00-14:00.","id":"mintixon","image":"images/radio-shows/mintixon.jpg","schedule":{"Wednesday":"13:00 - 14:00"},"title":"Μην Τυχόν"},{"description":"Μουσικές από όλον τον κόσμο, κάθε Κυριακή στο καλύτερο web radio του γαλαξία. Κάθε Κυριακή 6.00μ.μ.-8.00μ.μ.","id":"sundaystribute","image":"images/radio-shows/sundaystribute.jpg","schedule":{"Sunday":"18:00 - 20:00"},"title":"Sunday's Tribute"},{"description":"Στο Class City Rockers τα βάζουμε με τις εξουσίες και τους καταπιεστές. Και όταν δεν το κάνουμε εμείς, αφήνουμε τους αγαπημένους μας καλλιτέχνες να το κάνουν.","id":"classcityrockers","image":"images/radio-shows/classcityrockers.jpg","schedule":{"Sunday":"20:00 - 21:30"},"title":"Class City Rockers"},{"description":"Το Room Noir είναι μια μουσική εκπομπή με την Kuro Neko στα decks (ενίοτε και με παρέα) να μοιράζει σκοτεινή μουσική και τριχόμπαλες!","id":"roomnoir","image":"images/radio-shows/roomnoir.jpg","schedule":{"Tuesday":"18:30 - 19:30"},"title":"Room Noir"},{"description":"Θεωρεί πως από μικρή ηλικία είχε ήδη βρει την αγάπη της για το ραδιόφωνο και μπορεί να μιλάει για αυτήν πολλές ώρες. Κάθε Τετάρτη από τις 18.00 και για μια ώρα βρίσκεται πίσω από τα μικρόφωνα του Radio Reboot επιλέγοντας αγαπημένες μουσικές και πολλές πολλές φρέσκιες. Άλλωστε ένα αγαπημένο της χόμπι είναι να ανακαλύπτει νέους μουσικούς!","id":"coolcat","image":"images/radio-shows/coolcat.png","schedule":{"Wednesday":"18:00 - 19:00"},"title":"Cool Cat"},{"description":"Πέρα από το συμβάν, πέρα από το γεγονός, η ουσία βρίσκεται εκτός. Εβδομαδιαίο ενημερωτικό μαγκαζίνο με περίσσευμα μουσικής, στο Radio Reboot.","id":"ektos","image":"images/radio-shows/ektos.jpg","schedule":{"Friday":"16:30 - 18:30"},"title":"Εκτός"}]`</script><script>function parseTime(e){const[t,n]=e.split(":").map(Number);return
